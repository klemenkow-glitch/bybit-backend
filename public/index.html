<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Trading Terminal (MAINNET)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #ffffff; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .card { background-color: #1e1e22; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { margin-top: 0; color: #f7a600; }
        label { font-size: 13px; color: #aaa; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 4px; border: none; box-sizing: border-box; font-size: 14px; }
        input, select { background-color: #2b2b30; color: #fff; }
        button { font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-connect { background-color: #f7a600; color: #000; }
        .btn-connect:hover { background-color: #e09600; }
        .btn-transfer { background-color: #2196F3; color: #fff; margin-top: 10px; }
        .btn-buy { background-color: #4CAF50; color: #fff; width: 48%; float: left; }
        .btn-buy:hover { background-color: #45a049; }
        .btn-sell { background-color: #f44336; color: #fff; width: 48%; float: right; }
        .btn-sell:hover { background-color: #da190b; }
        .clear { clear: both; }
        .status { margin-top: 15px; padding: 12px; border-radius: 4px; background: #2b2b30; word-break: break-all; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; font-size: 14px; }
        th { color: #f7a600; }
    </style>
</head>
<body>

<div class="container">
    <!-- KLJUČI IN POVEZAVA -->
    <div class="card">
        <h2>Bybit Terminal (MAINNET)</h2>
        
        <label>API Key:</label>
        <input type="text" id="apiKey" placeholder="Vnesite Bybit API Key">

        <label>API Secret:</label>
        <input type="password" id="apiSecret" placeholder="Vnesite Bybit API Secret">

        <button class="btn-connect" onclick="connectAndFetch()">Shrani in Osveži Stanje</button>

        <div class="status" id="statusBox">Status: <b>Čakam na povezavo...</b></div>
    </div>

    <!-- PREGLED SREDSTEV -->
    <div class="card">
        <h3>Vaša Sredstva na Bybitu</h3>
        <table>
            <thead>
                <tr>
                    <th>Valuta</th>
                    <th>Račun</th>
                    <th>Skupno</th>
                    <th>Na voljo</th>
                </tr>
            </thead>
            <tbody id="balanceTable">
                <tr><td colspan="4" style="text-align:center; color:#777;">Ni podatkov. Vnesite ključe zgoraj.</td></tr>
            </tbody>
        </table>

        <!-- HITRI PRENOS SREDSTEV -->
        <div style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
            <label>Prenos iz Funding na Unified (za trgovanje):</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="transferCoin" value="EUR" style="width: 30%;" placeholder="Kovanec">
                <input type="number" id="transferAmount" value="26" style="width: 40%;" placeholder="Znesek">
                <button class="btn-transfer" style="width: 30%; margin: 6px 0;" onclick="transferToUnified()">Prenesi</button>
            </div>
            <div id="transferStatus" style="font-size: 12px; margin-top: 5px;"></div>
        </div>
    </div>

    <!-- HITRO TRGOVANJE -->
    <div class="card">
        <h3>Hitro Trgovanje (Market Order)</h3>
        
        <label>Trgovalni Par (Symbol):</label>
        <input type="text" id="tradeSymbol" value="EURUSDT" placeholder="npr. EURUSDT ali BTCUSDT">

        <label>Količina:</label>
        <input type="number" step="any" id="tradeQty" placeholder="Količina za nakup/prodajo">

        <div style="margin-top: 15px;">
            <button class="btn-buy" onclick="executeOrder('Buy')">KUPI (BUY)</button>
            <button class="btn-sell" onclick="executeOrder('Sell')">PRODAJ (SELL)</button>
            <div class="clear"></div>
        </div>

        <div class="status" id="orderStatusBox">Naročilo: <b>Pripravljeno</b></div>
    </div>
</div>

<script>
    const BACKEND_URL = 'http://localhost:3000';

    async function connectAndFetch() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const apiSecret = document.getElementById('apiSecret').value.trim();
        const statusBox = document.getElementById('statusBox');
        const balanceTable = document.getElementById('balanceTable');

        if (!apiKey || !apiSecret) {
            alert('Prosimo, vnesite oba API ključa!');
            return;
        }

        statusBox.style.color = '#ffffff';
        statusBox.innerHTML = 'Pridobivam stanje iz Bybita...';

        try {
            const res = await fetch(`${BACKEND_URL}/api/balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ apiKey, apiSecret })
            });

            const resData = await res.json();

            if (resData.status === 'success' || resData.retCode === 0) {
                statusBox.style.color = '#4CAF50';
                statusBox.innerHTML = '<b>Povezano uspešno!</b> Stanje osveženo.';

                const coins = resData.data?.list?.[0]?.coin || resData.result?.list?.[0]?.coin || resData.balances || [];
                
                if (coins.length > 0) {
                    balanceTable.innerHTML = '';
                    coins.forEach(c => {
                        const bal = parseFloat(c.walletBalance || c.transferBalance || c.equity || 0);
                        if (bal > 0) {
                            balanceTable.innerHTML += `
                                <tr>
                                    <td><b>${c.coin || c.currency}</b></td>
                                    <td>${c.accountType || 'Funding/Unified'}</td>
                                    <td>${bal.toFixed(2)}</td>
                                    <td>${bal.toFixed(2)}</td>
                                </tr>
                            `;
                        }
                    });
                } else {
                    balanceTable.innerHTML = '<tr><td colspan="4" style="text-align:center;">Na računu ni najdenih sredstev nad 0.</td></tr>';
                }
            } else {
                statusBox.style.color = '#f44336';
                statusBox.innerHTML = `<b>Napaka:</b> ${resData.message || resData.retMsg || 'Neznana napaka'}`;
            }
        } catch (err) {
            statusBox.style.color = '#f44336';
            statusBox.innerHTML = `<b>Lokalna napaka:</b> Preverite, ali teče 'node server.js'.`;
        }
    }

    async function transferToUnified() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const apiSecret = document.getElementById('apiSecret').value.trim();
        const coin = document.getElementById('transferCoin').value.trim().toUpperCase();
        const amount = document.getElementById('transferAmount').value.trim();
        const status = document.getElementById('transferStatus');

        status.style.color = '#fff';
        status.innerHTML = 'Prenašam sredstva...';

        try {
            const res = await fetch(`${BACKEND_URL}/api/transfer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ apiKey, apiSecret, coin, amount, fromType: 'FUND', toType: 'UNIFIED' })
            });

            const data = await res.json();

            if (data.retCode === 0 || data.status === 'success') {
                status.style.color = '#4CAF50';
                status.innerHTML = '<b>Prenos uspešen!</b> Sredstva so pripravljena za trgovanje.';
                setTimeout(connectAndFetch, 1000);
            } else {
                status.style.color = '#f44336';
                status.innerHTML = `<b>Napaka pri prenosu:</b> ${data.retMsg || data.message}`;
            }
        } catch (err) {
            status.style.color = '#f44336';
            status.innerHTML = `<b>Lokalna napaka pri prenosu.</b>`;
        }
    }

    async function executeOrder(side) {
        const apiKey = document.getElementById('apiKey').value.trim();
        const apiSecret = document.getElementById('apiSecret').value.trim();
        const symbol = document.getElementById('tradeSymbol').value.trim().toUpperCase();
        const qty = document.getElementById('tradeQty').value.trim();
        const orderStatusBox = document.getElementById('orderStatusBox');

        if (!symbol || !qty || parseFloat(qty) <= 0) {
            alert('Vnesite veljaven trgovalni par in količino!');
            return;
        }

        orderStatusBox.style.color = '#ffffff';
        orderStatusBox.innerHTML = `Pošiljam ${side} naročilo za ${qty} ${symbol}...`;

        try {
            const res = await fetch(`${BACKEND_URL}/api/order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ apiKey, apiSecret, symbol, side, qty })
            });

            const data = await res.json();

            if (data.retCode === 0 || data.status === 'success') {
                orderStatusBox.style.color = '#4CAF50';
                orderStatusBox.innerHTML = `<b>Naročilo USPEŠNO!</b> (${side} ${qty} ${symbol})`;
                setTimeout(connectAndFetch, 1500);
            } else {
                orderStatusBox.style.color = '#f44336';
                orderStatusBox.innerHTML = `<b>Napaka pri naročilu (${data.retCode || data.code}):</b> ${data.retMsg || data.message}`;
            }
        } catch (err) {
            orderStatusBox.style.color = '#f44336';
            orderStatusBox.innerHTML = `<b>Lokalna napaka:</b> ${err.message}`;
        }
    }
</script>

</body>
</html>
