<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit AI Terminal (MAINNET)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #ffffff; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: auto; }
        .card { background-color: #1e1e22; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { margin-top: 0; color: #f7a600; }
        label { font-size: 13px; color: #aaa; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 4px; border: none; box-sizing: border-box; font-size: 14px; }
        input, select { background-color: #2b2b30; color: #fff; }
        button { font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-connect { background-color: #f7a600; color: #000; }
        .btn-connect:hover { background-color: #e09600; }
        .btn-buy { background-color: #4CAF50; color: #fff; width: 48%; float: left; }
        .btn-buy:hover { background-color: #45a049; }
        .btn-sell { background-color: #f44336; color: #fff; width: 48%; float: right; }
        .btn-sell:hover { background-color: #da190b; }
        .clear { clear: both; }
        .status { margin-top: 15px; padding: 12px; border-radius: 4px; background: #2b2b30; word-break: break-all; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; font-size: 13px; }
        th { color: #f7a600; }
        .signal-card { background: #26262c; padding: 14px; border-radius: 6px; margin-top: 10px; border-left: 5px solid #777; }
        .signal-BUY { border-left-color: #4CAF50; }
        .signal-SELL { border-left-color: #f44336; }
        .signal-HOLD { border-left-color: #f7a600; }
        .badge { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-BUY { background: #4CAF50; color: #fff; }
        .badge-SELL { background: #f44336; color: #fff; }
        .badge-HOLD { background: #f7a600; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Bybit AI Terminal (MAINNET)</h2>
        
        <label>Geslo aplikacije (APP_PASSWORD):</label>
        <input type="password" id="appPassword" placeholder="Vnesite geslo aplikacije">

        <label>Znesek za posamezen nakup (€/$):</label>
        <input type="number" id="totalBudget" value="26" placeholder="Vnesite znesek">

        <button class="btn-connect" onclick="connectAndFetch()">Poveži in Osveži Stanje</button>

        <div class="status" id="statusBox">Status: <b>Čakam na povezavo...</b></div>
    </div>

    <div class="card">
        <h3>Vaša Sredstva na Bybitu</h3>
        <table>
            <thead>
                <tr>
                    <th>Valuta</th>
                    <th>Račun</th>
                    <th>Skupno</th>
                    <th>Na voljo</th>
                </tr>
            </thead>
            <tbody id="balanceTable">
                <tr><td colspan="4" style="text-align:center; color:#777;">Vnesite geslo zgoraj.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h3>TOP 5 AI Trgovalni Signali (Real-Time)</h3>
        <div id="aiSignalsContainer">
            <div style="color: #777; text-align: center; padding: 10px;">Vnesite geslo in kliknite Poveži...</div>
        </div>
    </div>
</div>

<script>
    const BACKEND_URL = window.location.origin;
    let autoScanInterval = null;

    async function connectAndFetch() {
        const password = document.getElementById('appPassword').value.trim();
        const statusBox = document.getElementById('statusBox');
        const balanceTable = document.getElementById('balanceTable');

        if (!password) {
            alert('Prosimo, vnesite geslo aplikacije!');
            return;
        }

        statusBox.style.color = '#ffffff';
        statusBox.innerHTML = 'Pridobivam stanje iz Bybita...';

        try {
            const res = await fetch(`${BACKEND_URL}/api/balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const resData = await res.json();

            if (resData.status === 'success' && resData.data) {
                const totalEquity = resData.data.totalEquity ? ` (${resData.data.totalEquity.toFixed(2)} USD)` : '';
                statusBox.style.color = '#4CAF50';
                statusBox.innerHTML = `<b>Povezano uspešno!</b> Skupno stanje: <b>${totalEquity}</b>`;

                const coins = resData.data.coins || [];
                if (coins.length > 0) {
                    balanceTable.innerHTML = '';
                    coins.forEach(c => {
                        balanceTable.innerHTML += `
                            <tr>
                                <td><b>${c.coin}</b></td>
                                <td>${c.account}</td>
                                <td>${c.total.toFixed(4)}</td>
                                <td>${c.free.toFixed(4)}</td>
                            </tr>
                        `;
                    });
                } else {
                    balanceTable.innerHTML = '<tr><td colspan="4" style="text-align:center;">Na računu ni sredstev z vrednostjo nad 0.</td></tr>';
                }

                startAIScanner();
            } else {
                statusBox.style.color = '#f44336';
                statusBox.innerHTML = `<b>Napaka:</b> ${resData.message || 'Napačno geslo'}`;
            }
        } catch (err) {
            statusBox.style.color = '#f44336';
            statusBox.innerHTML = `<b>Lokalna napaka:</b> Preverite strežnik.`;
        }
    }

    function startAIScanner() {
        if (autoScanInterval) clearInterval(autoScanInterval);
        runAnalysis();
        autoScanInterval = setInterval(runAnalysis, 4000);
    }

    async function runAnalysis() {
        const password = document.getElementById('appPassword').value.trim();
        const totalAmount = document.getElementById('totalBudget').value || 26;
        const container = document.getElementById('aiSignalsContainer');

        if (!password) return;

        try {
            const res = await fetch(`${BACKEND_URL}/api/analyze`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, totalAmount })
            });

            const data = await res.json();
            if (data.status === 'success' && data.data) {
                container.innerHTML = '';
                const items = data.data.items || [];
                const fullAmt = data.data.fullAmount || totalAmount;

                items.forEach(item => {
                    const sig = item.signal || 'HOLD';
                    const price = parseFloat(item.lastPrice || 0).toFixed(4);
                    const reasons = (item.reasons || []).join(' | ');

                    container.innerHTML += `
                        <div class="signal-card signal-${sig}">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <b style="font-size: 16px;">${item.symbol}</b> 
                                    <span style="font-size: 13px; color: #aaa; margin-left: 8px;">Cena: <b>$${price}</b></span>
                                    <br>
                                    <span style="font-size: 11px; color: #888;">Znesek ob nakupu: ${fullAmt} €</span>
                                </div>
                                <div>
                                    <span class="badge badge-${sig}">${sig}</span>
                                </div>
                            </div>
                            
                            <div style="font-size: 11px; color: #ccc; margin: 8px 0;">
                                Kazalniki: ${reasons}
                            </div>

                            <div style="margin-top: 10px;">
                                <button class="btn-buy" onclick="executeTrade('${item.symbol}', 'Buy', '${fullAmt}')">KUPI (BUY)</button>
                                <button class="btn-sell" onclick="executeTrade('${item.symbol}', 'Sell', '${fullAmt}')">PRODAJ (SELL)</button>
                                <div class="clear"></div>
                            </div>
                        </div>
                    `;
                });
            }
        } catch (err) {
            console.log('Spremljanje:', err.message);
        }
    }

    async function executeTrade(symbol, side, amount) {
        const password = document.getElementById('appPassword').value.trim();

        if (!password) {
            alert('Vnesite geslo aplikacije zgoraj!');
            return;
        }

        const msg = side === 'Buy' 
            ? `Potrjujete KUPI za ${symbol} v znesku ${amount} €?` 
            : `Potrjujete PRODAJ VSE za ${symbol}?`;

        if (!confirm(msg)) return;

        try {
            const res = await fetch(`${BACKEND_URL}/api/trade`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, symbol, side, amount })
            });

            const data = await res.json();

            if (data.status === 'success' || data.code === 0) {
                alert(`Uspešno: ${data.message || side + ' ' + symbol}`);
                connectAndFetch();
            } else {
                alert(`Bybit Napaka (${data.code}): ${data.message}`);
            }
        } catch (err) {
            alert(`Lokalna napaka pri povezavi: ${err.message}`);
        }
    }
</script>

</body>
</html>
