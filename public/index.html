<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit AI Terminal (Pro Panel)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #ffffff; padding: 15px; margin: 0; }
        .container { max-width: 650px; margin: auto; }
        .card { background-color: #1e1e22; padding: 18px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { margin-top: 0; color: #f7a600; font-size: 18px; }
        label { font-size: 13px; color: #aaa; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 4px; border: none; box-sizing: border-box; font-size: 14px; }
        input, select { background-color: #2b2b30; color: #fff; }
        button { font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-connect { background-color: #f7a600; color: #000; }
        .btn-connect:hover { background-color: #e09600; }
        .btn-buy { background-color: #4CAF50; color: #fff; width: 48%; float: left; }
        .btn-sell { background-color: #f44336; color: #fff; width: 48%; float: right; }
        .btn-close-pos { background-color: #f44336; color: #fff; padding: 8px 12px; font-size: 12px; width: auto; margin: 0; }
        .clear { clear: both; }
        .status { margin-top: 15px; padding: 10px; border-radius: 4px; background: #2b2b30; word-break: break-all; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; font-size: 13px; }
        th { color: #f7a600; }
        .signal-card { background: #26262c; padding: 14px; border-radius: 6px; margin-top: 10px; border-left: 5px solid #777; }
        .signal-BUY { border-left-color: #4CAF50; }
        .signal-SELL { border-left-color: #f44336; }
        .signal-HOLD { border-left-color: #f7a600; }
        .badge { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-BUY { background: #4CAF50; color: #fff; }
        .badge-SELL { background: #f44336; color: #fff; }
        .profit-pos { color: #4CAF50; font-weight: bold; }
        .loss-pos { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Bybit AI Terminal (Pro Panel)</h2>
        
        <label>Geslo aplikacije (APP_PASSWORD):</label>
        <input type="password" id="appPassword" placeholder="Vnesite geslo aplikacije">

        <label>Znesek za vstop v trade (€):</label>
        <input type="number" id="totalBudget" value="1.5" step="0.1" placeholder="Vnesite znesek">

        <button class="btn-connect" onclick="connectAndFetch()">Poveži in Zaženi Terminal</button>

        <div class="status" id="statusBox">Status: <b>Čakam na povezavo...</b></div>
    </div>

    <!-- AKTIVNE POZICIJE Z REAL-TIME P&L -->
    <div class="card">
        <h3>Aktivne Pozicije & Dobiček (P&L)</h3>
        <div id="activePositionsContainer">
            <div style="color: #777; text-align: center; padding: 10px;">Ni aktivnih pozicij ali pa ni povezano.</div>
        </div>
    </div>

    <div class="card">
        <h3>TOP 5 AI Priložnosti za Trgovanje</h3>
        <div id="aiSignalsContainer">
            <div style="color: #777; text-align: center; padding: 10px;">Vnesite geslo in kliknite Poveži...</div>
        </div>
    </div>
</div>

<script>
    const BACKEND_URL = window.location.origin;
    let autoScanInterval = null;

    async function connectAndFetch() {
        const password = document.getElementById('appPassword').value.trim();
        const statusBox = document.getElementById('statusBox');

        if (!password) {
            alert('Prosimo, vnesite geslo aplikacije!');
            return;
        }

        statusBox.style.color = '#ffffff';
        statusBox.innerHTML = 'Pridobivam podatke iz Bybita...';

        try {
            const res = await fetch(`${BACKEND_URL}/api/balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const resData = await res.json();

            if (resData.status === 'success' && resData.data) {
                const totalEquity = resData.data.totalEquity ? resData.data.totalEquity : 0;
                statusBox.style.color = '#4CAF50';
                statusBox.innerHTML = `<b>Povezano uspešno!</b> Skupno premoženje: <b>${totalEquity.toFixed(2)} EUR</b>`;

                // Samodejno nastavi vnosni okenca na dejansko stanje, če je manjše od 25
                if (totalEquity > 0) {
                    document.getElementById('totalBudget').value = totalEquity.toFixed(2);
                }

                renderActivePositions(resData.data.activePositions || []);
                startAIScanner();
            } else {
                statusBox.style.color = '#f44336';
                statusBox.innerHTML = `<b>Napaka:</b> ${resData.message || 'Napačno geslo'}`;
            }
        } catch (err) {
            statusBox.style.color = '#f44336';
            statusBox.innerHTML = `<b>Lokalna napaka:</b> Preverite strežnik.`;
        }
    }

    function renderActivePositions(positions) {
        const container = document.getElementById('activePositionsContainer');
        if (!positions || positions.length === 0) {
            container.innerHTML = '<div style="color: #777; text-align: center; padding: 8px;">Trenutno nimate odprtih aktivnih pozicij (vse je v gotovini).</div>';
            return;
        }

        container.innerHTML = '';
        positions.forEach(pos => {
            const pnlClass = pos.eurValue >= 0 ? 'profit-pos' : 'loss-pos';
            container.innerHTML += `
                <div style="background: #2b2b30; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <b style="font-size: 15px; color: #f7a600;">${pos.symbol}</b><br>
                        <span style="font-size: 12px; color: #aaa;">Količina: ${pos.size.toFixed(6)}</span><br>
                        <span style="font-size: 13px;" class="${pnlClass}">Vrednost: €${pos.eurValue.toFixed(2)}</span>
                    </div>
                    <div>
                        <button class="btn-close-pos" onclick="executeTrade('${pos.symbol}', 'Sell', 0)">ZAPRI POZICIJO</button>
                    </div>
                </div>
            `;
        });
    }

    function startAIScanner() {
        if (autoScanInterval) clearInterval(autoScanInterval);
        runAnalysis();
        autoScanInterval = setInterval(runAnalysis, 4000);
    }

    async function runAnalysis() {
        const password = document.getElementById('appPassword').value.trim();
        const totalAmount = document.getElementById('totalBudget').value || 1.5;
        const container = document.getElementById('aiSignalsContainer');

        if (!password) return;

        try {
            const res = await fetch(`${BACKEND_URL}/api/analyze`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, totalAmount })
            });

            const data = await res.json();
            if (data.status === 'success' && data.data && data.data.items && data.data.items.length > 0) {
                container.innerHTML = '';
                const items = data.data.items;
                const fullAmt = data.data.fullAmount || totalAmount;

                items.forEach(item => {
                    const sig = item.signal || 'HOLD';
                    const price = item.lastPrice > 0 ? (item.lastPrice < 10 ? item.lastPrice.toFixed(4) : item.lastPrice.toFixed(2)) : '0.00';
                    const reasons = (item.reasons || []).join(' | ');

                    container.innerHTML += `
                        <div class="signal-card signal-${sig}">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <b style="font-size: 16px;">${item.symbol}</b><br>
                                    <span style="font-size: 13px; color: #aaa;">Cena: <b>€${price}</b></span>
                                </div>
                                <div>
                                    <span class="badge badge-${sig}">${sig}</span>
                                </div>
                            </div>
                            
                            <div style="font-size: 11px; color: #ccc; margin: 8px 0;">
                                AI Analiza: ${reasons}
                            </div>

                            <div style="margin-top: 10px;">
                                <button class="btn-buy" onclick="executeTrade('${item.symbol}', 'Buy', '${fullAmt}')">ODPRI TRADE (KUPI)</button>
                                <button class="btn-sell" onclick="executeTrade('${item.symbol}', 'Sell', '${fullAmt}')">ZAPRI / PRODAJ</button>
                                <div class="clear"></div>
                            </div>
                        </div>
                    `;
                });
            }
        } catch (err) {
            console.log('Osveževanje:', err.message);
        }
    }

    async function executeTrade(symbol, side, amount) {
        const password = document.getElementById('appPassword').value.trim();

        if (!password) {
            alert('Vnesite geslo aplikacije zgoraj!');
            return;
        }

        const msg = side === 'Buy' 
            ? `Ali želite odpreti trade za ${symbol} v znesku ${amount} €?` 
            : `Ali ste prepričani, da želite zapreti pozicijo za ${symbol}?`;

        if (!confirm(msg)) return;

        try {
            const res = await fetch(`${BACKEND_URL}/api/trade`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, symbol, side, amount })
            });

            const data = await res.json();

            if (data.status === 'success' || data.code === 0) {
                alert(`USPEŠNO: ${data.message}`);
                connectAndFetch();
            } else {
                alert(`Bybit Napaka (${data.code}): ${data.message}`);
            }
        } catch (err) {
            alert(`Lokalna napaka pri povezavi: ${err.message}`);
        }
    }
</script>

</body>
</html>
