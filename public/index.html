<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit AI Trading Terminal (MAINNET)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #ffffff; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: auto; }
        .card { background-color: #1e1e22; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { margin-top: 0; color: #f7a600; }
        label { font-size: 13px; color: #aaa; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 4px; border: none; box-sizing: border-box; font-size: 14px; }
        input, select { background-color: #2b2b30; color: #fff; }
        button { font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-connect { background-color: #f7a600; color: #000; }
        .btn-connect:hover { background-color: #e09600; }
        .btn-buy { background-color: #4CAF50; color: #fff; width: 48%; float: left; }
        .btn-buy:hover { background-color: #45a049; }
        .btn-sell { background-color: #f44336; color: #fff; width: 48%; float: right; }
        .btn-sell:hover { background-color: #da190b; }
        .clear { clear: both; }
        .status { margin-top: 15px; padding: 12px; border-radius: 4px; background: #2b2b30; word-break: break-all; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; font-size: 13px; }
        th { color: #f7a600; }
        .signal-card { background: #26262c; padding: 12px; border-radius: 6px; margin-top: 8px; border-left: 4px solid #777; }
        .signal-BUY { border-left-color: #4CAF50; }
        .signal-SELL { border-left-color: #f44336; }
        .signal-HOLD { border-left-color: #f7a600; }
        .badge { font-weight: bold; padding: 3px 6px; border-radius: 3px; font-size: 12px; }
        .badge-BUY { background: #4CAF50; color: #fff; }
        .badge-SELL { background: #f44336; color: #fff; }
        .badge-HOLD { background: #f7a600; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <!-- GESLO IN POVEZAVA -->
    <div class="card">
        <h2>Bybit AI Terminal (MAINNET)</h2>
        
        <label>Geslo aplikacije (APP_PASSWORD):</label>
        <input type="password" id="appPassword" placeholder="Vnesite geslo aplikacije">

        <button class="btn-connect" onclick="connectAndFetch()">Poveži in Osveži Stanje</button>

        <div class="status" id="statusBox">Status: <b>Čakam na povezavo...</b></div>
    </div>

    <!-- PREGLED SREDSTEV -->
    <div class="card">
        <h3>Vaša Sredstva na Bybitu</h3>
        <table>
            <thead>
                <tr>
                    <th>Valuta</th>
                    <th>Račun</th>
                    <th>Skupno</th>
                    <th>Na voljo</th>
                </tr>
            </thead>
            <tbody id="balanceTable">
                <tr><td colspan="4" style="text-align:center; color:#777;">Vnesite geslo zgoraj.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- AI SKENER & SIGNALI V REALNEM ČASU -->
    <div class="card">
        <h3>AI Skener & Signali (Real-Time)</h3>
        
        <label>Trgovalni pari za spremljanje (do 5 parov, ločeni s vejico):</label>
        <input type="text" id="scanSymbols" value="BTCUSDT, ETHUSDT, EURUSDT, SOLUSDT, XRPUSDT">

        <div style="display: flex; gap: 10px;">
            <div style="width: 50%;">
                <label>Časovna analiza:</label>
                <select id="scanInterval">
                    <option value="1s">1 sekunda (Real-time)</option>
                    <option value="10s" selected>10 sekund (Priporočeno)</option>
                    <option value="20s">20 sekund</option>
                    <option value="1m">1 minuta</option>
                </select>
            </div>
            <div style="width: 50%;">
                <label>Skupni znesek za razdelitev (€/$):</label>
                <input type="number" id="totalBudget" value="26" placeholder="npr. 26">
            </div>
        </div>

        <div id="aiSignalsContainer" style="margin-top: 15px;">
            <div style="color: #777; font-size: 13px; text-align: center;">Začetek spremljanja po uspešni povezavi...</div>
        </div>
    </div>

    <!-- HITRO TRGOVANJE -->
    <div class="card">
        <h3>Hitro Trgovanje (Market Order)</h3>
        
        <label>Trgovalni Par (Symbol):</label>
        <input type="text" id="tradeSymbol" value="BTCUSDT">

        <label>Znesek ali Količina za Trgovanje:</label>
        <input type="number" step="any" id="tradeAmount" placeholder="Vnesite znesek">

        <div style="margin-top: 15px;">
            <button class="btn-buy" onclick="executeTrade('Buy')">KUPI (BUY)</button>
            <button class="btn-sell" onclick="executeTrade('Sell')">PRODAJ (SELL)</button>
            <div class="clear"></div>
        </div>

        <div class="status" id="orderStatusBox">Naročilo: <b>Pripravljeno</b></div>
    </div>
</div>

<script>
    const BACKEND_URL = 'http://localhost:3000';
    let aiLoopInterval = null;

    // 1. POVEZAVA IN PRIDOBIVANJE STANJA
    async function connectAndFetch() {
        const password = document.getElementById('appPassword').value.trim();
        const statusBox = document.getElementById('statusBox');
        const balanceTable = document.getElementById('balanceTable');

        if (!password) {
            alert('Prosimo, vnesite geslo aplikacije!');
            return;
        }

        statusBox.style.color = '#ffffff';
        statusBox.innerHTML = 'Pridobivam stanje iz Bybita...';

        try {
            const res = await fetch(`${BACKEND_URL}/api/balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const resData = await res.json();

            if (resData.status === 'success' && resData.data) {
                const totalEquity = resData.data.totalEquity ? ` (${resData.data.totalEquity.toFixed(2)} USD)` : '';
                statusBox.style.color = '#4CAF50';
                statusBox.innerHTML = `<b>Povezano uspešno!</b> Skupno stanje: <b>${totalEquity}</b>`;

                const coins = resData.data.coins || [];
                if (coins.length > 0) {
                    balanceTable.innerHTML = '';
                    coins.forEach(c => {
                        balanceTable.innerHTML += `
                            <tr>
                                <td><b>${c.coin}</b></td>
                                <td>${c.account}</td>
                                <td>${c.total.toFixed(4)}</td>
                                <td>${c.free.toFixed(4)}</td>
                            </tr>
                        `;
                    });
                } else {
                    balanceTable.innerHTML = '<tr><td colspan="4" style="text-align:center;">Na računu ni najdenih sredstev z vrednostjo nad 0.</td></tr>';
                }

                // Po uspešni povezavi zaženemo samodejni AI skener v ozadju
                startAIScanner();
            } else {
                statusBox.style.color = '#f44336';
                statusBox.innerHTML = `<b>Napaka:</b> ${resData.message || 'Neznana napaka'}`;
            }
        } catch (err) {
            statusBox.style.color = '#f44336';
            statusBox.innerHTML = `<b>Lokalna napaka:</b> Preverite, ali teče 'node server.js'.`;
        }
    }

    // 2. SAMODEJNI AI SKENER (Teka v ozadju na 5-10s)
    function startAIScanner() {
        if (aiLoopInterval) clearInterval(aiLoopInterval);

        runAnalysis(); // Izvedemo takoj
        aiLoopInterval = setInterval(runAnalysis, 5000); // Nato ponavljamo na 5 sekund
    }

    async function runAnalysis() {
        const password = document.getElementById('appPassword').value.trim();
        const rawSymbols = document.getElementById('scanSymbols').value.split(',').map(s => s.trim());
        const interval = document.getElementById('scanInterval').value;
        const totalAmount = document.getElementById('totalBudget').value;
        const container = document.getElementById('aiSignalsContainer');

        if (!password) return;

        try {
            const res = await fetch(`${BACKEND_URL}/api/analyze`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, symbols: rawSymbols, interval, totalAmount })
            });

            const data = await res.json();
            if (data.status === 'success' && data.data) {
                container.innerHTML = '';
                const items = data.data.items || [];
                const perSymbol = data.data.amountPerSymbol || 0;

                items.forEach(item => {
                    if (!item.ok) return;
                    
                    const sig = item.signal || 'HOLD';
                    const score = item.score || 0;
                    const price = parseFloat(item.lastPrice).toFixed(4);
                    const reasons = (item.reasons || []).join(' | ');

                    container.innerHTML += `
                        <div class="signal-card signal-${sig}">
                            <div style="display: flex; justify-space-between; align-items: center;">
                                <div>
                                    <b>${item.symbol}</b> - Cena: <b>${price}</b>
                                    <span style="font-size: 11px; color: #aaa; margin-left: 8px;">(Razdeljen znesek: ${perSymbol})</span>
                                </div>
                                <div>
                                    <span class="badge badge-${sig}">${sig} (Score: ${score})</span>
                                </div>
                            </div>
                            <div style="font-size: 11px; color: #ccc; margin-top: 6px;">
                                Kazalniki: ${reasons}
                            </div>
                        </div>
                    `;
                });
            }
        } catch (err) {
            console.log('AI skener napaka v ozadju:', err.message);
        }
    }

    // 3. HITRO TRGOVANJE
    async function executeTrade(side) {
        const password = document.getElementById('appPassword').value.trim();
        const symbol = document.getElementById('tradeSymbol').value.trim().toUpperCase();
        const amount = document.getElementById('tradeAmount').value.trim();
        const orderStatusBox = document.getElementById('orderStatusBox');

        if (!password) {
            alert('Vnesite geslo aplikacije zgoraj!');
            return;
        }

        if (!symbol || !amount || parseFloat(amount) <= 0) {
            alert('Vnesite veljaven trgovalni par in znesek!');
            return;
        }

        orderStatusBox.style.color = '#ffffff';
        orderStatusBox.innerHTML = `Pošiljam ${side} naročilo za ${amount} na ${symbol}...`;

        try {
            const res = await fetch(`${BACKEND_URL}/api/trade`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, symbol, side, amount })
            });

            const data = await res.json();

            if (data.status === 'success') {
                orderStatusBox.style.color = '#4CAF50';
                orderStatusBox.innerHTML = `<b>Naročilo USPEŠNO!</b> (${side} ${symbol})`;
                setTimeout(connectAndFetch, 1200);
            } else {
                orderStatusBox.style.color = '#f44336';
                orderStatusBox.innerHTML = `<b>Napaka pri naročilu (${data.code}):</b> ${data.message}`;
            }
        } catch (err) {
            orderStatusBox.style.color = '#f44336';
            orderStatusBox.innerHTML = `<b>Lokalna napaka:</b> ${err.message}`;
        }
    }
</script>

</body>
</html>
